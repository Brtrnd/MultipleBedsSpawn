name: MultipleBedsSpawn
version: 1.0
main: com.brtrnd.multiplebedsspawn.MultipleBedsSpawn
api-version: 1.20


permissions:
  MultipleBedsSpawn:
    description: Enables multi-bed respawn system
    default: true

  MultipleBedsSpawn.beds.*:
    description: Bed count override
    default: false

  MultipleBedsSpawn.command.list:
    description: Allows listing beds
    default: true
    
commands:
  multibeds:
    description: Manage your stored beds
    usage: /multibeds list
